<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Piyush Bhendarkar — Premium Photography Portfolio</title>
    <meta name="description" content="Luxury, cinematic photography portfolio for Piyush Bhendarkar, Photographer & Visual Storyteller. Turning moments into timeless stories." />
    <meta name="robots" content="noindex, nofollow" id="robots-meta" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="Piyush Bhendarkar — Premium Photography Portfolio" />
    <meta property="og:description" content="Luxury, cinematic photography portfolio for Piyush Bhendarkar, Photographer & Visual Storyteller. Turning moments into timeless stories." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.jpg" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Piyush Bhendarkar — Premium Photography Portfolio" />
    <meta name="twitter:description" content="Luxury, cinematic photography portfolio for Piyush Bhendarkar, Photographer & Visual Storyteller." />
    <meta name="twitter:image" content="/og-image.jpg" />

    <!-- Google Fonts: Cormorant Garamond (Editorial Luxury Display) & Plus Jakarta Sans (Clean Modern Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#0a0a0a] text-[#f4efe6] antialiased selection:bg-[#d4af37]/30 selection:text-[#f3e5ab]">
    <!-- Hidden static form for Netlify detector -->
    <form name="photography-enquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="shootType" />
      <input type="text" name="package" />
      <input type="text" name="date" />
      <input type="text" name="location" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
